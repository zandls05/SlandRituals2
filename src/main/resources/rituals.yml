# Rituales. Puedes editarlos aquí o desde el juego con /rituales editar <id>.
# Todo lo que no pongas en "cinematic:" se toma de animaciones.yml.
rituals:
  guardian_caido:
    name: "&4Guardián Caído"
    description:
      - "&7Un antiguo guardián que se alza"
      - "&7ante las ofrendas de carne y hueso."
    icon: ZOMBIE_HEAD       # opcional; por defecto el huevo del mob
    cooldown: 300           # segundos que el altar queda inactivo tras morir el jefe
    radius: 60              # bloques a la redonda que ven y oyen el ritual
    visibility: ALL         # ALL = jugadores cercanos, STARTER = solo quien activa
    offerings:              # MATERIAL: cantidad
      ROTTEN_FLESH: 32
      BONE: 16
      GOLD_INGOT: 4
    conditions:
      min-players: 0        # jugadores mínimos dentro del radio
      time: ANY             # ANY, DAY o NIGHT
      permission: ""        # permiso extra necesario (vacío = ninguno)
    boss:
      type: ZOMBIE          # jefe vanilla (también es la alternativa si fallan Boss/MythicMobs)
      boss-id: ""           # nombre del jefe del plugin Boss de MineAcademy (opcional, tiene prioridad)
      mythic-id: ""         # id de MythicMobs (opcional)
      # name: "&4Guardián Caído"   # por defecto, el nombre del ritual
      health: 200
      damage: 10
      bar-color: RED        # PINK, BLUE, RED, GREEN, YELLOW, PURPLE, WHITE
      spawn:                # desplazamiento respecto al centro del altar
        x: 0
        y: 1
        z: 0
      gear:
        helmet: NETHERITE_HELMET
        chestplate: NETHERITE_CHESTPLATE
        leggings: NETHERITE_LEGGINGS
        boots: NETHERITE_BOOTS
        main-hand: NETHERITE_SWORD
    cinematic:
      charge:
        duration: 10
        title: "&4{ritual}"
        subtitle: "&7El ritual se completa en &c{time}"
        animations:
          magic_circle: {particle: DUST, color: "#B00020", size: 1.3}
          arcane_spiral: {particle: SOUL_FIRE_FLAME}
          magic_runes: {color: "#FF4D6D"}
          arcane_overload: {}
    rewards:
      xp: 500
      vanilla-drops: false
      drops:                # MATERIAL: cantidad
        DIAMOND: 8
        NETHERITE_SCRAP: 2
      commands:             # se ejecutan como consola. %player% = quien lo mató
        - "say %player% venció al Guardián Caído"

  senor_esqueleto:
    name: "&fSeñor Esqueleto"
    description:
      - "&7Hueso, flechas y un arco ancestral."
    cooldown: 180
    offerings:
      BONE_BLOCK: 8
      ARROW: 64
    boss:
      type: WITHER_SKELETON
      health: 150
      damage: 8
      bar-color: WHITE
      gear:
        main-hand: BOW
    cinematic:
      charge:
        duration: 8
    rewards:
      xp: 300
      vanilla-drops: true
      drops:
        EMERALD: 12
      commands: []

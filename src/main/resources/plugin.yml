name: SlandRituals
main: dev.slandrituals.SlandRitualsPlugin
version: ${project.version}
api-version: '1.21'
description: Altares mágicos, rituales con cinemáticas e invocación de jefes.
softdepend: [Boss, MythicMobs, PlaceholderAPI]
commands:
  rituales:
    description: Administra rituales y altares
    usage: /rituales ayuda
    aliases: [ritual]
permissions:
  slandrituals.admin:
    description: Crear, editar, probar y recargar rituales y altares
    default: op
  slandrituals.use:
    description: Hacer ofrendas en los altares
    default: true
